<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>OurApp</title>
    <link href="https://fonts.googleapis.com/css?family=Public+Sans:300,400,400i,700,700i&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous" />
    <script defer src="https://use.fontawesome.com/releases/v5.5.0/js/all.js" integrity="sha384-GqVMZRt5Gn7tB9D9q7ONtcp4gtHIUEW/yG7h98J7IpE3kpi+srfFyyB/04OV6pG0" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <header class="header-bar">
      <div class="container d-flex flex-column flex-md-row align-items-center p-3">
        <h4 class="my-0 mr-md-auto font-weight-normal">
          <a href="index.html" class="text-white">
            WriteSpace
          </a>
        </h4>
        <form class="header-login">
          <input name="username"
            class="form-control"
            type="text"
            placeholder="Username"
            autocomplete="off"
          />

          <input name="password"
            class="form-control"
            type="password"
            placeholder="Password"
          />

          <button class="btn btn-success">Sign In</button>
        </form>
      </div>
    </header>
    <!-- new hero Section -->
    <div class="hero">
        <div class="container hero-inner">
          
          <!-- LEFT CONTENT -->
          <div class="hero-text">
            <h1>Write like it matters.</h1>
            <p>
              Slow down. Think clearly. Share ideas that actually mean something.  
              This is a place for real writing — not noise.
            </p>
          </div>
          
          <!-- RIGHT FORM -->
          <div class="hero-card">
            <h4>Create your account</h4>
            
            <form>
              <div class="form-group">
                <label for="username-register" class="text-muted mb-1">
                  <small>Username</small>
                </label>
                <input class="form-control" type="text" placeholder="Pick a username" />
                <div class="alert alert-danger small liveValidateMessage liveValidateMessage--visible">
                  Invalid Username
                </div>
              </div>

              <div class="form-group">
                <label for="email-register" class="text-muted mb-1">
                  <small>Email</small>
                </label>
                <input class="form-control" type="email" placeholder="you@example.com" />
                <div class="alert alert-danger small liveValidateMessage liveValidateMessage--visible">
                  Invalid Email Address
                </div>
              </div>

              <div class="form-group">
                <label for="password-register" class="text-muted mb-1">
                  <small>Password</small>
                </label>
                <input class="form-control" type="password" placeholder="Create a password" />
                <!-- only to be included when there is an Error
                <div class="alert alert-danger small liveValidateMessage liveValidateMessage--visible">
                  Invalid Password
                </div>
                -->
              </div>

              <button class="btn btn-success btn-block btn-lg mt-3">
                Get Started
              </button>
            </form>
          </div>

        </div>
      </div>
  
    <!-- End of New Hero Section -->
    <footer class="border-top text-center small text-muted py-3">
      <p><a href="index.html" class="mx-1">Home</a> | <a class="mx-1" href="about-us.html">About Us</a> | <a class="mx-1" href="terms.html">Terms</a></p>
      <p class="m-0">Copyright &copy; 2026 <a href="/" class="text-muted">WriteSpace</a>. All rights reserved.</p>
    </footer>
  </body>
</html>
